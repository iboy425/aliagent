# Agent主流程快速复现配置

llm:
  model: "qwen-turbo"
  api_key: ""
  base_url: ""
  temperature: 0.7
  max_tokens: 2048
  timeout: 120

research:
  budget: 1
  time_limit: 1800
  early_stop_patience: 1
  enable_literature: true
  enable_diagnosis: true
  enable_design: true
  enable_experiment: true
  max_iterations: 1
  output_dir: "./output/repro_agent_step6"

tasks:
  task1:
    task_id: 1
    task_type: "classification"
    data_path: "data/cls_data/A1.npz"
    sample_path: "data/cls_data/sample_submission.csv"
    model_type: "sage"
    hidden_dim: 128
    num_layers: 2
    lr: 0.01
    epochs: 6
    early_stop: 5
    dropout: 0.5

  task2:
    task_id: 2
    task_type: "recommendation"
    data_path: "data/rec_data"
    sample_path: "data/rec_data/sample_submission.csv"
    model_type: "gru4rec"
    embedding_dim: 64
    hidden_dim: 128
    lr: 0.001
    epochs: 2
    early_stop: 2
    batch_size: 512
    dropout: 0.2

device: "cpu"
seed: 42
